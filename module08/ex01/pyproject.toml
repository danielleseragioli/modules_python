[tool.poetry]
name = "loading-programs"
version = "1.0.0"
description = "Matrix data analysis with dependency management via pip and Poetry"
authors = ["dseragio <dseragio@tudent.42porto.com>"]

[tool.poetry.dependencies]
python = ">=3.10"
pandas = "2.1.0"
numpy = "1.26.0"
matplotlib = "3.7.2"
requests = "2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
